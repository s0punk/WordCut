name: word_cut
description: "Word game"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  diacritic: ^0.1.6
  dotted_border: ^3.1.0
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_fit_utils_ui: ^1.10.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^9.0.0
  hotspot: ^0.1.3
  http: ^1.6.0
  intl: any
  lottie: ^3.3.2
  path_provider: ^2.1.5
  pinput: ^7.0.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.4

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/word_lists/
    - assets/lottie/
